<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sanvyra</title>
<style>
:root{--b:#7c5cff;--b2:#22d3ee;--bg:#0b0b1a;--c:#ffffff0d;--bd:#ffffff1a;--t:#e8e8ff;--m:#9a9cc8;--in:#ffffff12}
[data-theme=light]{--bg:#eef0ff;--c:#ffffffb3;--bd:#7c5cff22;--t:#1b1b3a;--m:#5b5d8a;--in:#fff}
*{box-sizing:border-box}body{margin:0;font:15px 'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--t);overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.45;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
.o1{width:420px;height:420px;background:var(--b);top:-100px;left:-100px}.o2{width:380px;height:380px;background:var(--b2);bottom:-120px;right:-80px;animation-delay:-6s}
@keyframes fl{to{transform:translate(80px,60px) scale(1.2)}}
aside{position:fixed;top:0;bottom:0;left:0;width:230px;background:var(--c);backdrop-filter:blur(18px);border-right:1px solid var(--bd);padding:18px 12px;overflow:auto;z-index:5;transition:.3s}
.logo{font-size:22px;font-weight:800;background:linear-gradient(90deg,var(--b),var(--b2));-webkit-background-clip:text;color:transparent;margin:0 8px 18px}
aside a{display:flex;gap:10px;align-items:center;color:var(--m);padding:10px 12px;border-radius:10px;text-decoration:none;margin-bottom:4px;position:relative;transition:.25s}
aside a:hover{color:var(--t);background:var(--in);transform:translateX(4px)}aside a.on{color:#fff;background:linear-gradient(90deg,var(--b),#5b8cff);box-shadow:0 6px 20px #7c5cff55}
main{margin-left:230px;padding:26px;animation:pg .5s cubic-bezier(.2,.8,.2,1)}@keyframes pg{from{opacity:0;transform:translateY(18px)}}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap}h1{margin:0;font-size:26px}
.card,.mo{background:var(--c);backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:16px;transition:.3s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #0004}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.cards .card{animation:pg .6s both;animation-delay:calc(var(--i)*90ms)}
.cards b{display:block;font-size:34px;background:linear-gradient(90deg,var(--b),var(--b2));-webkit-background-clip:text;color:transparent}
button{background:linear-gradient(135deg,var(--b),#5b8cff);color:#fff;border:0;border-radius:10px;padding:9px 15px;cursor:pointer;font:inherit;transition:.25s;position:relative;overflow:hidden}
button:hover{transform:translateY(-2px);box-shadow:0 8px 20px #7c5cff66}button:active{transform:scale(.96)}button.r{background:linear-gradient(135deg,#ef4444,#f97316)}button.g{background:#64748b}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;margin-top:4px;background:var(--in);color:var(--t);outline:0;transition:.25s}
input:focus,select:focus{border-color:var(--b);box-shadow:0 0 0 3px #7c5cff33}select option{color:#000}label{display:block;font-size:13px;color:var(--m);margin-bottom:10px}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--c);backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
td,th{padding:11px 14px;text-align:left;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--m);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
tbody tr,tr{animation:ri .45s both;animation-delay:calc(var(--i,0)*35ms)}@keyframes ri{from{opacity:0;transform:translateX(-14px)}}tr:hover td{background:var(--in)}
.sr{max-width:280px;margin:0 0 12px}.tag{padding:3px 9px;border-radius:20px;background:#7c5cff33;font-size:12px}
.ov{position:fixed;inset:0;background:#000a;backdrop-filter:blur(6px);display:grid;place-items:center;z-index:20;animation:fi .25s;overflow:auto;padding:14px}@keyframes fi{from{opacity:0}}
.mo{width:min(520px,100%);background:var(--bg);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{opacity:0;transform:scale(.85)}}
.drop{border:2px dashed var(--b);border-radius:14px;padding:26px;text-align:center;cursor:pointer;margin-bottom:12px;transition:.3s;color:var(--m)}.drop.h,.drop:hover{background:#7c5cff22;transform:scale(1.02)}
.bars div.row{display:flex;align-items:center;gap:10px;margin:9px 0}.bars span{width:110px;color:var(--m);font-size:13px}.bars i{display:block;height:14px;width:0;border-radius:8px;background:linear-gradient(90deg,var(--b),var(--b2));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
#chat{height:56vh;overflow:auto;padding:14px}.m{margin:10px 0;padding:11px 14px;border-radius:14px;max-width:82%;white-space:pre-wrap;animation:pop .35s}
.u{background:linear-gradient(135deg,var(--b),#5b8cff);color:#fff;margin-left:auto}.a{background:var(--in);border:1px solid var(--bd)}.m small{display:block;margin-top:8px;color:var(--m)}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--b2);animation:bn 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes bn{50%{transform:translateY(-6px)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.chips button{background:var(--in);color:var(--t);border:1px solid var(--bd);font-size:13px}
#toasts{position:fixed;top:16px;right:16px;z-index:50}.ts{background:#16a34a;color:#fff;padding:12px 18px;border-radius:12px;margin-bottom:8px;animation:ti .4s;box-shadow:0 8px 24px #0005}.ts.e{background:#dc2626}@keyframes ti{from{transform:translateX(120%)}}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center;min-height:100vh;padding:5vw;max-width:1100px;margin:auto}
.hero h1{font-size:clamp(38px,6vw,64px);background:linear-gradient(90deg,var(--b),var(--b2));-webkit-background-clip:text;color:transparent;letter-spacing:.04em}
.hero li{margin:8px 0;color:var(--m);animation:pg .6s both;animation-delay:calc(var(--i)*120ms)}
.sk{height:90px;border-radius:14px;background:linear-gradient(90deg,var(--in),#ffffff25,var(--in));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
#mb{display:none;position:fixed;top:10px;left:10px;z-index:9}
@media(max-width:800px){aside{transform:translateX(-100%)}aside.open{transform:none}main{margin:0;padding:60px 14px 14px}#mb{display:block}.hero{grid-template-columns:1fr}}
</style></head><body><div class="orb o1"></div><div class="orb o2"></div><div id="toasts"></div><button id="mb" onclick="$('aside').classList.toggle('open')">☰</button><div id="app"></div><script>
const $=s=>document.querySelector(s),BR=['CSE','IT','ECE','ME','CE','EE'],TY=['notes','assignment','ppt','question_paper','other'],SM=[1,2,3,4,5,6,7,8];
let T=localStorage.t,U=JSON.parse(localStorage.u||'null'),FL={};document.documentElement.dataset.theme=localStorage.th||'dark';
const MENU={hod:['dashboard','teachers','subjects','syllabus','timetable','documents','students','chatbot','profile'],teacher:['dashboard','mysubjects','upload','documents','syllabus','timetable','chatbot','profile'],student:['dashboard','documents','syllabus','timetable','chatbot','profile']};
const IC={dashboard:'📊',teachers:'👨‍🏫',subjects:'📚',syllabus:'📘',timetable:'🗓️',documents:'📁',students:'🎓',chatbot:'🤖',profile:'👤',mysubjects:'📚',upload:'⬆️'};
const lbl=m=>({dashboard:'Dashboard',teachers:'Teachers',subjects:'Subjects',syllabus:'Syllabus',timetable:'Timetable',students:'Students',chatbot:'Sanvyra AI',profile:'Profile',mysubjects:'My Subjects',upload:'Upload Material',documents:U.role=='student'?'Study Materials':U.role=='teacher'?'My Documents':'Documents'}[m]);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opt=a=>a.map(x=>`<option>${x}</option>`).join(''),inp=(n,l,t='text')=>`<label>${l}<input name="${n}" type="${t}"></label>`,sel=(n,l,a)=>`<label>${l}<select name="${n}">${opt(a)}</select></label>`;
function toast(m,e){const d=document.createElement('div');d.className='ts'+(e?' e':'');d.textContent=m;$('#toasts').append(d);setTimeout(()=>{d.style.transition='.4s';d.style.opacity=0;setTimeout(()=>d.remove(),400)},2800)}
async function api(p,o={}){const h={};if(T)h.Authorization='Bearer '+T;let b=o.body;if(b&&!(b instanceof FormData)){b=JSON.stringify(b);h['Content-Type']='application/json'}
 const r=await fetch('/api'+p,{method:o.method||'GET',headers:h,body:b}),d=await r.json().catch(()=>({}));if(r.status==401&&T){logout();throw new Error('Session expired')}
 if(!r.ok)throw new Error(typeof d.detail=='string'?d.detail:'Invalid input');return d}
const fd=e=>{e.preventDefault();return new FormData(e.target)},obj=f=>Object.fromEntries(f.entries());
const run=async(f,m)=>{try{await f();closeM();if(m)toast(m);render()}catch(e){toast(e.message,1)}};
const logout=()=>{localStorage.removeItem('t');localStorage.removeItem('u');T=U=null;location.hash='#/login';render()};
const theme=()=>{const t=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=localStorage.th=t};
function modal(t,h){closeM();document.body.insertAdjacentHTML('beforeend',`<div class=ov id=ov onclick="event.target==this&&closeM()"><div class=mo><h3>${t}</h3>${h}</div></div>`)}
const closeM=()=>$('#ov')&&$('#ov').remove();
async function dl(id,n){const r=await fetch('/api/documents/'+id+'/download',{headers:{Authorization:'Bearer '+T}});if(!r.ok)return toast('Download failed',1);const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download=n;a.click();toast('Downloading…')}
const sf=i=>{const v=i.value.toLowerCase();i.parentElement.nextElementSibling.querySelectorAll('tr:not(:first-child)').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(v)?'':'none')};
const srch=()=>`<div><input class=sr placeholder="🔎 Search..." oninput="sf(this)"></div>`;
const ro=(l,f)=>l.map((x,i)=>`<tr style="--i:${i}">${f(x)}</tr>`).join('')||'<tr><td colspan=9 style="color:var(--m)">Nothing here yet ✨</td></tr>';
const dt=(l,del)=>srch()+`<table><tr><th>Title</th><th>Type</th><th>Subject</th><th>Branch/Sem</th><th>By</th><th>Date</th><th></th></tr>${ro(l,d=>`<td>${esc(d.title)}</td><td><span class=tag>${d.document_type}</span></td><td>${esc(d.subject_name||'-')}</td><td>${d.branch} / ${d.semester}</td><td>${esc(d.uploader)}</td><td>${d.created_at.slice(0,10)}</td><td><button onclick="dl(${d.id},'${esc(d.title).replace(/'/g,'')}.${d.file_type}')">⬇</button> ${del?`<button class=r onclick="delDoc(${d.id})">🗑</button>`:''}</td>`)}</table>`;
const delDoc=id=>confirm('Delete this document?')&&run(()=>api('/documents/'+id,{method:'DELETE'}),'Deleted');
const del=(w,id)=>confirm('Delete?')&&run(()=>api('/'+w+'/'+id,{method:'DELETE'}),'Deleted');
function authView(r){const f={
 login:`<form class=card onsubmit="doLogin(event)"><h2>Welcome back 👋</h2>${inp('email','Email','email')}${inp('password','Password','password')}<button style="width:100%">Login</button><p><a href="#/register">Student register</a> · <a href="#/forgot">Forgot password?</a></p></form>`,
 register:`<form class=card onsubmit="doReg(event)"><h2>Student Registration</h2>${inp('name','Name')}${inp('email','Email','email')}${inp('password','Password','password')}${inp('enrollment_no','Enrollment No')}${sel('branch','Branch',BR)}${sel('year','Year',[1,2,3,4])}${sel('semester','Semester',SM)}<button style="width:100%">Create account</button><p><a href="#/login">Back to login</a></p></form>`,
 forgot:`<form class=card onsubmit="doForgot(event)"><h2>Reset Password</h2>${inp('email','Email','email')}<button name=a value=1>Get reset token</button><hr style="opacity:.2;margin:16px 0">${inp('token','Reset token')}${inp('new_password','New password','password')}<button name=a value=2>Reset</button><p><a href="#/login">Back</a></p></form>`};
 return `<div class=hero><div><h1>SANVYRA</h1><h2>Smart Department Knowledge Portal</h2><ul style="list-style:none;padding:0"><li style="--i:1">🤖 RAG AI assistant with source citations</li><li style="--i:2">📚 Semester-wise notes, syllabus & timetable</li><li style="--i:3">🔐 Role-based access: HOD · Teacher · Student</li><li style="--i:4">⚡ Instant search across every uploaded document</li></ul></div>${f[r]||f.login}</div>`}
const doLogin=e=>run(async()=>{const d=await api('/login',{method:'POST',body:obj(fd(e))});T=d.token;U=d.user;localStorage.t=T;localStorage.u=JSON.stringify(U);location.hash='#/dashboard'},'Logged in ✅');
const doReg=e=>run(async()=>{await api('/register',{method:'POST',body:obj(fd(e))});location.hash='#/login'},'Registered! Please login');
const doForgot=e=>{const f=fd(e),b=e.submitter.value,o=obj(f);run(async()=>{if(b==1)toast((await api('/forgot-password',{method:'POST',body:{email:o.email}})).message);else{await api('/reset-password',{method:'POST',body:o});location.hash='#/login'}},b==2?'Password reset':'')};
const P={
async dashboard(){const[s,c,d]=await Promise.all([api('/stats'),api('/stats/chart'),api('/documents?limit=6')]),mx=Math.max(1,...c.map(x=>x.n));
 return `<div class=top><h1>Hello, ${esc(U.name)} 👋</h1></div><div class=cards>${Object.entries(s).map(([k,v],i)=>`<div class=card style="--i:${i}"><b data-n="${v}">0</b>${k}</div>`).join('')}</div><div class=card><h3>Documents by type</h3><div class=bars>${c.map(x=>`<div class=row><span>${x.k}</span><i data-w="${x.n/mx*100}"></i><b style="font-size:14px">${x.n}</b></div>`).join('')||'<p style="color:var(--m)">No documents yet</p>'}</div></div><h3>Recent materials</h3>${dt(d)}`},
async teachers(){const[t,s]=await Promise.all([api('/teachers'),api('/subjects')]);window.TC=t;window.SB=s;return `<div class=top><h1>Teachers</h1><button onclick="openT()">＋ Add Teacher</button></div>${srch()}<table><tr><th>Name</th><th>Email</th><th>Emp ID</th><th>Subjects</th><th></th></tr>${ro(t,x=>`<td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.employee_id||'')}</td><td>${esc(x.subjects)}</td><td><button onclick="openT(${x.id})">✏️</button> <button class=r onclick="del('teachers',${x.id})">🗑</button></td>`)}</table>`},
async subjects(){const s=await api('/subjects');window.SB=s;const h=U.role=='hod';return `<div class=top><h1>${lbl('subjects')}</h1>${h?'<button onclick="openS()">＋ Add Subject</button>':''}</div>${srch()}<table><tr><th>Name</th><th>Code</th><th>Branch</th><th>Sem</th><th></th></tr>${ro(s,x=>`<td>${esc(x.subject_name)}</td><td><span class=tag>${esc(x.subject_code)}</span></td><td>${x.branch}</td><td>${x.semester}</td><td>${h?`<button onclick="openS(${x.id})">✏️</button> <button class=r onclick="del('subjects',${x.id})">🗑</button>`:''}</td>`)}</table>`},
mysubjects:()=>P.subjects(),
syllabus:()=>typePage('syllabus'),timetable:()=>typePage('timetable'),
async upload(){const s=await api('/subjects');window.SB=s;return `<div class=top><h1>Upload Material</h1></div><div class=card>${upForm(null)}</div>`},
async documents(){const s=await api('/subjects'),q=new URLSearchParams();if(FL.t)q.set('document_type',FL.t);if(FL.s)q.set('subject_id',FL.s);if(U.role=='teacher')q.set('mine',1);const d=await api('/documents?'+q);
 return `<div class=top><h1>${lbl('documents')}</h1><div style="display:flex;gap:8px"><select onchange="FL.t=this.value;render()"><option value="">All types</option>${['notes','assignment','ppt','question_paper','syllabus','timetable','other'].map(x=>`<option ${FL.t==x?'selected':''}>${x}</option>`).join('')}</select><select onchange="FL.s=this.value;render()"><option value="">All subjects</option>${s.map(x=>`<option value=${x.id} ${FL.s==x.id?'selected':''}>${esc(x.subject_name)}</option>`).join('')}</select></div></div>${dt(d,U.role!='student')}`},
async students(){const s=await api('/students');return `<div class=top><h1>Students</h1></div>${srch()}<table><tr><th>Name</th><th>Email</th><th>Branch</th><th>Yr/Sem</th><th>Enroll</th><th>Status</th></tr>${ro(s,x=>`<td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${x.branch}</td><td>${x.year}/${x.semester}</td><td>${esc(x.enrollment_no||'')}</td><td><button class="${x.is_active?'g':'r'}" onclick="blk(${x.id},${x.is_active?0:1})">${x.is_active?'Block':'Unblock'}</button></td>`)}</table>`},
async chatbot(){const h=await api('/chat/history');return `<div class=top><h1>🤖 Sanvyra AI</h1><button class=g onclick="$('#chat').innerHTML=''">Clear view</button></div><div class=chips>${['Summarize the syllabus','Important topics for exams','Explain unit 1 basics'].map(x=>`<button onclick="$('#qi').value='${x}';$('#cf').requestSubmit()">${x}</button>`).join('')}</div><div class=card id=chat>${h.map(x=>bub(x.question,'u')+bub(x.answer,'a',x.sources)).join('')||bub('Hi! Ask me anything from the uploaded department documents 📚','a')}</div><form class=card id=cf style="display:flex;gap:8px" onsubmit="ask(event)"><input id=qi name=question placeholder="Type your question..." autocomplete=off style="margin:0"><button style="width:100px">Send ➤</button></form>`},
async profile(){return `<div class=top><h1>Profile</h1></div><form class=card onsubmit="saveP(event)" style="max-width:480px"><p>${esc(U.email)} · <span class=tag>${U.role}</span>${U.branch?` · ${U.branch} Sem ${U.semester}`:''}</p>${inp('name','Name')}${inp('password','New password (optional)','password')}<button>Update</button></form>`}};
const bub=(t,c,s=[])=>`<div class="m ${c}">${esc(t)}${s.length?`<small>📎 ${s.map(x=>esc(x.document)+' (p.'+x.page+')').join(', ')}</small>`:''}</div>`;
async function typePage(t){const d=await api('/documents?document_type='+t),h=U.role=='hod';return `<div class=top><h1>${lbl(t)}</h1>${h?`<button onclick="openUp('${t}')">⬆ Upload ${t}</button>`:''}</div>${dt(d,h)}`}
const dz=`<div class=drop id=dz onclick="$('#fi').click()" ondragover="event.preventDefault();this.classList.add('h')" ondragleave="this.classList.remove('h')" ondrop="event.preventDefault();$('#fi').files=event.dataTransfer.files;fn()">📄 <b>Drop file here</b> or click to browse<br><small id=fnm>PDF · DOCX · PPTX · TXT</small></div><input id=fi type=file name=file hidden onchange="fn()">`;
const fn=()=>{const f=$('#fi').files[0];$('#fnm').textContent=f?f.name:'PDF · DOCX · PPTX · TXT'};
function upForm(t){return `<form onsubmit="up(event)">${inp('title','Title')}${inp('description','Description')}${t?`<input type=hidden name=document_type value=${t}>${sel('branch','Branch',BR)}${sel('semester','Semester',SM)}`:`${sel('document_type','Type',U.role=='hod'?[...TY,'syllabus','timetable']:TY)}<label>Subject<select name=subject_id>${SB.map(x=>`<option value=${x.id}>${esc(x.subject_name)} (${x.branch} S${x.semester})</option>`).join('')}</select></label>`}${dz}<button style="width:100%">Upload & index for AI</button></form>`}
const openUp=t=>modal('Upload '+t,upForm(t));
const up=e=>{const f=fd(e);for(const[k,v]of[...f.entries()])if(v===''||(v instanceof File&&!v.name))f.delete(k);run(()=>api('/documents',{method:'POST',body:f}),'Uploaded & indexed for AI 🚀')};
function openT(id){const t=id?TC.find(x=>x.id==id):{subject_ids:[]};modal(id?'Edit teacher':'Add teacher',`<form onsubmit="saveT(event)"><input type=hidden name=id value="${id||''}">${inp('name','Name')}${inp('email','Email','email')}${inp('password','Password'+(id?' (blank = keep)':''),'password')}${inp('employee_id','Employee ID')}<label>Subjects (Ctrl/Cmd for multiple)<select name=subject_ids multiple size=5>${SB.map(x=>`<option value=${x.id}>${esc(x.subject_name)} (${x.branch} S${x.semester})</option>`).join('')}</select></label><button style="width:100%">Save</button></form>`);const f=$('#ov form');if(id){f.name.value=t.name;f.email.value=t.email;f.employee_id.value=t.employee_id||''}[...f.subject_ids.options].forEach(o=>o.selected=t.subject_ids.includes(+o.value))}
function openS(id){const s=id?SB.find(x=>x.id==id):{};modal(id?'Edit subject':'Add subject',`<form onsubmit="saveS(event)"><input type=hidden name=id value="${id||''}">${inp('subject_name','Subject name')}${inp('subject_code','Code')}${sel('branch','Branch',BR)}${sel('semester','Semester',SM)}<button style="width:100%">Save</button></form>`);if(id){const f=$('#ov form');['subject_name','subject_code','branch','semester'].forEach(k=>f[k].value=s[k])}}
const saveT=e=>{const f=fd(e),o=obj(f);o.subject_ids=f.getAll('subject_ids');run(()=>api('/teachers'+(o.id?'/'+o.id:''),{method:o.id?'PUT':'POST',body:o}),'Teacher saved')};
const saveS=e=>{const o=obj(fd(e));run(()=>api('/subjects'+(o.id?'/'+o.id:''),{method:o.id?'PUT':'POST',body:o}),'Subject saved')};
const blk=(id,a)=>run(()=>api('/students/'+id+'/status',{method:'POST',body:{is_active:a}}),'Updated');
const saveP=e=>run(async()=>{const o=obj(fd(e));for(const k in o)if(!o[k])delete o[k];U=await api('/me',{method:'PUT',body:o});localStorage.u=JSON.stringify(U)},'Profile updated');
async function ask(e){e.preventDefault();const i=$('#qi'),v=i.value.trim();if(!v)return;i.value='';const c=$('#chat');c.insertAdjacentHTML('beforeend',bub(v,'u')+'<div class="m a" id=th><span class=dots><span></span><span></span><span></span></span></div>');c.scrollTop=1e9;
 try{const r=await api('/chat',{method:'POST',body:{question:v}}),w=r.answer.split(' '),el=$('#th');el.textContent='';let k=0;const iv=setInterval(()=>{el.textContent+=(k?' ':'')+w[k++];c.scrollTop=1e9;if(k>=w.length){clearInterval(iv);el.outerHTML=bub(r.answer,'a',r.sources)}},25)}catch(x){$('#th').textContent=x.message}}
function anim(){document.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n;let s=null;const st=t=>{s??=t;const p=Math.min((t-s)/900,1);el.textContent=Math.round(n*(1-Math.pow(1-p,3)));p<1&&requestAnimationFrame(st)};requestAnimationFrame(st)});
 setTimeout(()=>document.querySelectorAll('[data-w]').forEach(b=>b.style.width=b.dataset.w+'%'),100)}
async function render(){const r=location.hash.replace('#/','')||'dashboard';
 if(!U){$('#app').innerHTML=authView(r);return}
 const p=MENU[U.role].includes(r)?r:'dashboard',m=$('main');if(!m)$('#app').innerHTML=`<aside><div class=logo>SANVYRA</div></aside><main><div class=sk></div></main>`;
 let h;try{h=await P[p]()}catch(e){h='<p>'+esc(e.message)+'</p>'}
 $('#app').innerHTML=`<aside><div class=logo>SANVYRA</div>${MENU[U.role].map(x=>`<a href="#/${x}" class="${x==p?'on':''}" onclick="$('aside').classList.remove('open')">${IC[x]} ${lbl(x)}</a>`).join('')}<a href="#" onclick="theme();return false">🌗 Theme</a><a href="#" onclick="logout();return false">🚪 Logout</a></aside><main>${h}</main>`;
 anim();const c=$('#chat');if(c)c.scrollTop=1e9}
addEventListener('hashchange',()=>{$('#app').innerHTML='';render()});render();
</script></body></html>
